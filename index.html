<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydia Dimitrova — Director, Editor, Creative Coder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FONT FOR THE PROJECT TEXT AND THE CONTACT SECTION
   To change it: drop any font file into the "fonts" folder,
   name it myfont.ttf (or edit the file name below), and refresh.
   ============================================================ */
@font-face{font-family:"MyFont";src:url("fonts/myfont.ttf") format("truetype"),url("fonts/myfont.otf") format("opentype");font-display:swap}

:root{
  --font:"MyFont","Inter Tight",system-ui,sans-serif;  /* <- one font for everything below the pictures */
  --bg:#000;
  --text:#fff;
  --muted:#c9c9c9;
  --accent:#f6b8cc;          /* underline color */
  --header-h:72px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--text);font-family:var(--font);scroll-behavior:smooth}
a{color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{height:var(--header-h);display:flex;justify-content:flex-end;align-items:center;padding:0 clamp(20px,4vw,56px)}
header a{text-decoration:none;font-size:16px;font-weight:500;border-bottom:2px solid var(--accent);padding-bottom:2px}

/* Pictures: full width, shown whole (never cropped) */
.shot{display:block;width:100%;background:#000}
.shot img{display:block;width:100%;height:auto}

/* Video grid: each tile is half the screen wide */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:4px}
.tile{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden;cursor:pointer;border:0;padding:0;color:#fff;text-align:left;font:inherit}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.tile video{opacity:0}
.tile.playing video,.tile.nothumb video{opacity:1}
.tile:hover video,.tile:hover img,.tile:focus-visible video,.tile:focus-visible img,.tile.playing video,.tile.playing img{transform:scale(1.03)}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:56px clamp(16px,2vw,32px) clamp(16px,2vw,28px);background:linear-gradient(transparent,rgba(0,0,0,.85))}
.tile h2{font-family:var(--font);font-weight:500;font-size:clamp(20px,2.2vw,32px)}
.tile span{display:block;margin-top:4px;font-size:15px;color:var(--muted)}

/* Lightbox */
dialog{border:0;background:transparent;padding:0;width:min(1200px,94vw);max-width:none;margin:auto;color:#fff}
dialog::backdrop{background:rgba(0,0,0,.94)}
dialog video{width:100%;display:block;background:#000}
dialog .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--font);font-size:20px}
dialog button{background:#fff;border:0;color:#000;padding:9px 18px;border-radius:999px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}

/* Contact */
.contact{text-align:center;padding:16vh clamp(20px,4vw,56px) 10vh}
.contact h2{font-family:var(--font);font-weight:400;font-size:clamp(34px,5.5vw,80px);line-height:1.05;letter-spacing:-.02em}
.contact .mail{display:inline-block;margin-top:32px;font-size:clamp(20px,2.6vw,34px);text-decoration:none;border-bottom:3px solid var(--accent);padding-bottom:4px;word-break:break-all}
.contact .tel{display:block;margin-top:22px;font-size:clamp(18px,2vw,24px);text-decoration:none}
footer{text-align:center;padding:0 20px 32px;color:var(--muted);font-size:14px}

@media (max-width:720px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.tile:hover video,.tile:hover img{transform:none}}
</style>
</head>
<body>

<header><a href="#contact">Contact</a></header>

<h1 class="sr-only">Lydia Dimitrova</h1>

<!-- Picture 1: your name. Save your HD image as images/header.jpg -->
<div class="shot"><img src="images/header.jpg" alt="Lydia Dimitrova — director, editor and creative coder"></div>

<!-- Picture 2: your info. Save your HD image as images/info.jpg -->
<div class="shot"><img src="images/info.jpg" alt="About Lydia Dimitrova"></div>

<main class="grid" id="grid"></main>

<section class="contact" id="contact">
  <h2>Let's make something.</h2>
  <a class="mail" href="mailto:dimitrovalydia@yahoo.com">dimitrovalydia@yahoo.com</a>
  <a class="tel" href="tel:+359886976475">+359 886 976 475</a>
</section>
<footer>© 2026 Lydia Dimitrova</footer>

<dialog id="player" aria-label="Video player">
  <div class="bar"><span id="ptitle"></span><button id="close">Close</button></div>
  <video id="pvideo" controls playsinline></video>
</dialog>

<script>
/* ============================================================
   YOUR PROJECTS: edit this list.
   file  = name of the video inside the "videos" folder
           (its thumbnail is picked automatically: project-1.mp4 -> thumbnails/thumbnail-project-1.jpg)
   title = big text on the tile
   info  = small text under it
   To add a project, copy one line. To remove one, delete its line.
   ============================================================ */
const projects=[
  {file:"project-1.mp4", title:"Project 1", info:"Client or category, 2026"},
  {file:"project-2.mp4", title:"Project 2", info:"Client or category, 2026"},
  {file:"project-3.mp4", title:"Project 3", info:"Client or category, 2026"},
  {file:"project-4.mp4", title:"Project 4", info:"Client or category, 2026"},
  {file:"project-5.mp4", title:"Project 5", info:"Client or category, 2026"},
  {file:"project-6.mp4", title:"Project 6", info:"Client or category, 2026"},
  {file:"project-7.mp4", title:"Project 7", info:"Client or category, 2026"},
  {file:"project-8.mp4", title:"Project 8", info:"Client or category, 2026"},
  {file:"project-9.mp4", title:"Project 9", info:"Client or category, 2026"},
  {file:"project-10.mp4", title:"Project 10", info:"Client or category, 2026"},
  {file:"project-11.mp4", title:"Project 11", info:"Client or category, 2026"},
  {file:"project-12.mp4", title:"Project 12", info:"Client or category, 2026"},
  {file:"project-13.mp4", title:"Project 13", info:"Client or category, 2026"},
  {file:"project-14.mp4", title:"Project 14", info:"Client or category, 2026"},
  {file:"project-15.mp4", title:"Project 15", info:"Client or category, 2026"},
  {file:"project-16.mp4", title:"Project 16", info:"Client or category, 2026"},
  {file:"project-17.mp4", title:"Project 17", info:"Client or category, 2026"},
  {file:"project-18.mp4", title:"Project 18", info:"Client or category, 2026"},
  {file:"project-19.mp4", title:"Project 19", info:"Client or category, 2026"},
  {file:"project-20.mp4", title:"Project 20", info:"Client or category, 2026"},
  {file:"project-21.mp4", title:"Project 21", info:"Client or category, 2026"},
  {file:"project-22.mp4", title:"Project 22", info:"Client or category, 2026"},
  {file:"project-23.mp4", title:"Project 23", info:"Client or category, 2026"},
  {file:"project-24.mp4", title:"Project 24", info:"Client or category, 2026"},
  {file:"project-25.mp4", title:"Project 25", info:"Client or category, 2026"},
];

const canHover=matchMedia('(hover:hover)').matches;
const play=t=>{const v=t.querySelector('video');v.play().catch(()=>{});t.classList.add('playing')};
const stop=t=>{const v=t.querySelector('video');v.pause();v.currentTime=.5;t.classList.remove('playing')};
const grid=document.getElementById('grid');
const ptitle=document.getElementById('ptitle');

projects.forEach(p=>{
  const t=document.createElement('button');
  t.className='tile';t.dataset.src='videos/'+p.file;t.dataset.title=p.title;
  t.innerHTML='<img alt=""><video muted loop playsinline preload="none"></video><div class="cap"><h2></h2><span></span></div>';
  const img=t.querySelector('img');
  img.src='thumbnails/'+(p.thumb||'thumbnail-'+p.file.replace(/\.[^.]+$/,'')+'.jpg');
  img.onerror=()=>{img.remove();t.classList.add('nothumb')}; // no thumbnail yet: show the video's first frame
  t.querySelector('h2').textContent=p.title;
  t.querySelector('span').textContent=p.info;
  grid.appendChild(t);

  // Load each video only when it is near the screen, so 25+ videos stay fast
  new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){
    t.querySelector('video').src=t.dataset.src+'#t=0.5';t.querySelector('video').preload='metadata';o.disconnect();
  }},{rootMargin:'800px'}).observe(t);

  if(canHover){
    t.addEventListener('mouseenter',()=>play(t));
    t.addEventListener('mouseleave',()=>stop(t));
    t.addEventListener('focus',()=>play(t));
    t.addEventListener('blur',()=>stop(t));
  } else {
    new IntersectionObserver(([e])=>e.isIntersecting?play(t):stop(t),{threshold:.7}).observe(t);
  }
  t.addEventListener('click',()=>{
    stop(t);
    pvideo.src=t.dataset.src;ptitle.textContent=t.dataset.title;
    player.showModal();pvideo.play().catch(()=>{});
  });
});

const player=document.getElementById('player');
const pvideo=document.getElementById('pvideo');
const closeBtn=document.getElementById('close');
const shut=()=>{pvideo.pause();pvideo.removeAttribute('src');pvideo.load();if(player.open)player.close()};
closeBtn.addEventListener('click',shut);
player.addEventListener('click',e=>{if(e.target===player)shut()});
player.addEventListener('close',()=>{pvideo.pause()}); // also covers the Esc key
</script>
</body>
</html>
